<!DOCTYPE html>
 <html lang="pt-br"> 
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport"
         content="width=device-width, initial-scale=1.0"> 
         <title>GameZone🎮</title>
<style>
    body {
        max-width: 100vw;
        margin: 0;
        background-color: #0b0b14;
        font-family: Arial, sans-serif;
    }

    header {
        background-color: #17172b;
        color: #00ffcc;
        text-align: center;
        max-width: 800px;
        margin: 0 auto;
        padding: 16px;
        border-bottom: 3px solid #8a2be2;
    }

    header h1 {
        color: #00ffcc;
    }

    header p {
        color: #ffffff;
    }

    main {
        background-color: #0b0b14;
        color: white;
        margin: 0 auto;
        padding: 16px;
        display: flex;
    }

    img {
        width: 80px;
        height: 80px;
        border-radius: 10px;
        border: 2px solid #00ffcc;
    }

    article {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;

        background-color: #17172b;
        border: 2px solid #8a2be2;

        margin: 16px;
        gap: 16px;
        padding: 16px;

        flex: 1 1 25%;

        border-radius: 12px;
    }

    article h2 {
        color: #00ffcc;
    }

    article p {
        color: #dddddd;
    }

    .artigo-autor {
        font-weight: bold;
        color: #ff00ff !important;
    }

    button {
        background-color: #242447;
        color: white;
        border: 2px solid #00ffcc;
        border-radius: 8px;

        margin: 4px;
